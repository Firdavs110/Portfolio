
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do App</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="container">

        <div class="todo-box">

            <h1>📝 Mening vazifalarim</h1>

            <p class="subtitle">
                Bugungi ishlaringni rejalashtir 🚀
            </p>

            <div class="input-box">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Yangi vazifa yozing..."
                >

                <button id="addBtn">Qo‘shish</button>
            </div>

            <ul id="taskList"></ul>

            <div class="bottom">
                <span id="taskCount">0 ta vazifa</span>

                <button id="clearBtn">
                    Hammasini o‘chirish
                </button>
            </div>

        </div>

    </div>

    <script src="script2.js"></script>

</body>
</html>
